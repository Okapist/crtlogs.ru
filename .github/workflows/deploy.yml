# Деплой: тесты + bootJar -> SCP на сервер -> перезапуск systemd-сервиса.
# Запускается вручную (Actions -> Deploy -> Run workflow) и на push в master.
# Секреты репозитория (Settings -> Secrets and variables -> Actions):
#   SSH_HOST  - хост сервера (например, crtlogs.ru или IP)
#   SSH_USER  - пользователь с sudo (деплой-скрипту нужен рестарт сервиса)
#   SSH_KEY   - приватный SSH-ключ (ed25519), публичный — в ~/.ssh/authorized_keys сервера
#   SSH_PORT  - (опционально) нестандартный порт ssh
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test bootJar

      - name: Upload jar
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: build/libs/crtlogs.ru-*.jar
          target: /tmp/crtlogs-deploy
          strip_components: 2

      - name: Install and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            sudo install -o crtlogs -g crtlogs -m 644 /tmp/crtlogs-deploy/crtlogs.ru-*.jar /opt/crtlogs/crtlogs.jar
            rm -f /tmp/crtlogs-deploy/crtlogs.ru-*.jar
            sudo systemctl restart crtlogs
            sleep 5
            systemctl is-active crtlogs
            curl -fsS http://127.0.0.1:8090/api/status >/dev/null && echo "health: OK"
