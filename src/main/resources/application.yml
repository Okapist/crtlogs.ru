server:
  # 8080 на этой машине занят встроенным сервером IntelliJ IDEA; меняется через SERVER_PORT
  port: 8090

spring:
  datasource:
    # Без AUTO_SERVER: он поднимает TCP-сервер H2 с -tcpAllowOthers на всех интерфейсах,
    # а пользователь по умолчанию — sa с пустым паролем, то есть любой, кто дотянется до
    # порта, получает всю БД и RCE через CREATE ALIAS ... FOR "java.lang.Runtime.exec".
    # Чтобы открыть файл из IDEA, остановите приложение (embedded-режим — один процесс).
    url: jdbc:h2:file:./data/ctlog
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always # schema.sql на каждом старте (там IF NOT EXISTS)
  task:
    scheduling:
      # синк занимает поток надолго; при size=1 (значение по умолчанию) чистка бакетов
      # RateLimitFilter не выполнялась бы, пока идёт догон большого лога
      pool:
        size: 2

ct:
  log-list-url: https://browser-resources.s3.yandex.net/ctlog/ctlog.json
  sync-interval: PT10M
  batch-size: 256
  # дополнительные доверенные сертификаты УЦ Минцифры для HTTPS CT-логов (через запятую);
  # серверы Минцифры не присылают промежуточный сертификат, поэтому нужен и Sub CA.
  # JDK не модифицируется.
  trust-cert: ${CT_TRUST_CERT:./data/russian_trusted_root_ca.cer,./data/russian_trusted_sub_ca_2024.crt}
  rate-limit:
    enabled: true
    rps: 1
    burst: 3
    trust-forwarded: false
  auth:
    token: ${CT_AUTH_TOKEN:} # пусто => /api/logs всегда 401
