<STYLE type="text/css">
  /* --- дизайн crt.sh --- */
  a {
    color: #015258;
    text-decoration: underline;
    white-space: nowrap;
  }
  body {
    font: 12pt "DM Sans", sans-serif;
    padding-top: 10px;
    text-align: center;
    margin: 0;
    padding-left: 16px;
    padding-right: 16px;
    box-sizing: border-box;
  }
  form {
    margin: 0px
  }
  span.crtsh {
    background-color: #015258;
    color: #FFFFFF;
    font: bold 30px "Urbanist", sans-serif;
    padding: 2px 20px;
    border-radius: 6px;
  }
  span.title {
    color: #333132;
    font: bold 30px "Urbanist", sans-serif;
    padding: 10px 12px;
  }
  .header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
  }
  .input {
    border: 1px solid #015258;
    border-radius: 6px;
    font: 500 14px "DM Sans", sans-serif;
    height: 44px;
    width: 528px;
    max-width: 78vw;
    box-sizing: border-box;
    padding: 0 12px;
    text-align: center
  }
  .input:focus {
    border-color: #015258;
    outline: none
  }
  .button {
    background-color: #015258;
    border: none;
    border-radius: 1280px;
    color: #FFFFFF;
    cursor: pointer;
    font: 600 16px "DM Sans", sans-serif;
    padding: 4px 8px;
    height: 44px
  }
  .copyright {
    font: 8pt "DM Sans", sans-serif;
    color: #000000;
    text-align: center;
    margin-top: 56px
  }

  /* --- наше: форма и подсказка --- */
  #searchForm { margin: 32px 0 0; }
  #searchForm label {
    font: 8pt "DM Sans", sans-serif;
    color: #888888;
    white-space: nowrap;
    vertical-align: middle;
  }
  #hint {
    font: 8pt "DM Sans", sans-serif;
    color: #888888;
    margin-top: 20px;
    line-height: 1.8
  }
  #hint code { font-family: "Roboto Mono", monospace; }
</STYLE>

<body>

  <DIV class="header">
    <A style="text-decoration:none" href="/"><SPAN class="crtsh">crtlogs.ru</SPAN></A> <SPAN class="title">Certificate Search</SPAN>
  </DIV>

  <!-- обычный GET-submit: результаты рисует сервер (HtmlView.resultsPage), -->
  <!-- поэтому прямая ссылка, F5 и «назад» работают без отдельной клиентской ветки -->
  <form id="searchForm" action="/" method="get">
    <input class="input" type="text" name="q" id="q" required autofocus autocomplete="off"
           placeholder="домен, например example.ru">
    <label><input type="checkbox" name="exclude" value="expired"> только действующие</label>
    <input class="button" type="submit" value="Search">
  </form>

  <div id="hint">
    Точное совпадение; поддомены — wildcard: <code>%.</code>например <code>%.example.ru</code><br>
    JSON-выдача как у crt.sh: <code>/?q=example.ru&amp;output=json</code>
  </div>

  <div id="logs"></div>

  <p class="copyright">&copy; crtlogs.ru &mdash; поиск по российским CT-логам (Yandex, VK, Минцифры), формат API совместим с crt.sh.</p>
